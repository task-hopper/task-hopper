[project]
name = "task-hopper"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "packaging>=24.0",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
hop = "hop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hop"]
